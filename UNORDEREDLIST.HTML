<html>
    <head>
<title>unordered list</title>
    </head>

    <body>
          <div>
            <h1>Unordered List in HTML</h1>
            <table>
                <tr>
                    <th>type-1</th><th>type-2</th>
                </tr>
                <tr><TD>
                    <ol type="1" Value="1"><LI>thor</LI><li>spiderman</li>
                        <li>ironman</li><li>captain America</li></ol>
                </TD></tr>
                <tr><TD><ol type="A" VALUE="E"><LI>thor</LI><li>spiderman</li>
                        <li>ironman</li><li>captain America</li></ol></TD></tr>
            </table>
        </div>
        
    </body>
</html>
